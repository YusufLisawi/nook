name: Nook
options:
  bundleIdPrefix: com.yusuf
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
      - path: Plugins
        type: folder
        buildPhase: resources
      - path: NookUI
        type: folder
        buildPhase: resources
    info:
      path: Nook/Info.plist
      properties:
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.yusuf.nook
            CFBundleURLSchemes: [nook]
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: Nook reads what's playing in Music and Spotify and controls playback.
        NSMicrophoneUsageDescription: Nook records your voice for dictation.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuf.nook
        CODE_SIGN_IDENTITY: "Nook Local Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
