name: Nook
options:
  bundleIdPrefix: com.yusuf
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: "$(ARCHS_STANDARD)"
    DEVELOPMENT_TEAM: B6K7724JDG # Motkan LLC — contributors: set your own team (or CODE_SIGN_IDENTITY "-")
    MACOSX_DEPLOYMENT_TARGET: "14.2"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
      - path: Plugins
        type: folder
        buildPhase: resources
      - path: NookUI
        type: folder
        buildPhase: resources
      - path: docs
        type: folder
        buildPhase: resources
      - path: skill
        type: folder
        buildPhase: resources
      - path: cli/template
        type: folder
        buildPhase: resources
      - path: PLUGINS.md
        buildPhase: resources
    dependencies:
      - sdk: AppIntents.framework # Xcode 26's metadata extractor expects the system framework to be linked.
      - package: Sparkle
      - target: nook-cli
        embed: true
        copy:
          destination: executables
    info:
      path: Nook/Info.plist
      properties:
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "10"
        CFBundleIconFile: AppIcon
        SUFeedURL: https://nook.motkan.com/appcast.xml
        SUPublicEDKey: o0nqzSMKi74tZHIX4EozjBPfG36ikQh6OblRjqlPddA= # gitleaks:allow (public key, ships in the app)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        CFBundleURLTypes:
          - CFBundleURLName: com.yusuf.nook
            CFBundleURLSchemes: [nook]
        LSUIElement: true
        LSMinimumSystemVersion: "14.2"
        NSAppleEventsUsageDescription: Nook reads what's playing in Music and Spotify and controls playback.
        NSMicrophoneUsageDescription: Nook records your voice for dictation.
        NSAudioCaptureUsageDescription: Nook's volume mixer changes each app's volume by routing its sound through Nook.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuf.nook
        CODE_SIGN_IDENTITY: "Developer ID Application"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: B6K7724JDG
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Nook/Nook.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  nook-cli:
    type: tool
    platform: macOS
    sources: [cli/swift]
    settings:
      base:
        PRODUCT_NAME: nook-cli
        SKIP_INSTALL: YES # embedded in Nook.app; must not become its own archive product
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuf.nook.cli
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        ENABLE_HARDENED_RUNTIME: NO
