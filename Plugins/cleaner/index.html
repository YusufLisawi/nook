<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-disk" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M3 12h14M13 14.5h1"/></symbol>
    <symbol id="i-cache" viewBox="0 0 20 20"><path d="m10 2 7 4-7 4-7-4 7-4ZM3 10l7 4 7-4M3 14l7 4 7-4"/></symbol>
    <symbol id="i-log" viewBox="0 0 20 20"><path d="M6 2h6l4 4v12H4V2h2ZM12 2v5h4M7 10h6M7 14h6"/></symbol>
    <symbol id="i-code" viewBox="0 0 20 20"><path d="m6 5-4 5 4 5M14 5l4 5-4 5M11.5 3l-3 14"/></symbol>
    <symbol id="i-phone" viewBox="0 0 20 20"><rect x="5" y="2" width="10" height="16" rx="2"/><path d="M9 15h2"/></symbol>
    <symbol id="i-package" viewBox="0 0 20 20"><path d="m10 2 7 4v8l-7 4-7-4V6l7-4ZM3 6l7 4 7-4M10 10v8M6.5 4l7 4"/></symbol>
    <symbol id="i-brew" viewBox="0 0 20 20"><path d="M4 7h10v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7ZM14 8h1a3 3 0 0 1 0 6h-1M7 2v2M11 2v2"/></symbol>
    <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 2v10m-4-4 4 4 4-4M3 12v5h14v-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M3 5h14M8 2h4l1 3M5 5l1 13h8l1-13M8 8v7M12 8v7"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 20 20"><path d="m8 3 1.7 4.3L14 9l-4.3 1.7L8 15l-1.7-4.3L2 9l4.3-1.7L8 3ZM15 2v4M13 4h4M16 13v4M14 15h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4 10 4 4 8-8"/></symbol>
  </defs></svg>

  <main class="nk-root">
    <header class="nk-row-flex disk-head">
      <div class="nk-fill">
        <div class="nk-row-flex disk-numbers"><span id="disk-free" class="nk-big">—</span><span id="disk-total" class="nk-small nk-muted">Checking disk…</span></div>
        <div id="disk-progress" class="nk-progress" role="progressbar" aria-label="Disk space used" aria-valuemin="0" aria-valuemax="100"><i id="disk-used"></i></div>
      </div>
      <div class="scan-controls"><button id="scan" class="nk-btn" type="button">Scan</button><span id="scanned" class="nk-small nk-muted">Not scanned yet</span></div>
    </header>

    <div id="error" class="nk-error" role="alert" hidden></div>

    <section class="nk-card nk-tight nk-col nk-fill content">
      <div id="loading" class="nk-empty" role="status"><span class="nk-spinner"></span><span>Loading your last scan…</span></div>
      <div id="categories" class="nk-list nk-scroll nk-fill nk-roving" aria-label="Cleanup categories" hidden></div>
      <div id="empty" class="nk-empty" hidden><svg class="icon"><use href="#i-sparkles"/></svg><b>All clear</b><span>No eligible files found. Scan again later.</span></div>
    </section>

    <div id="result" class="nk-row-flex" role="status" hidden><div class="nk-fill"><div id="result-title" class="nk-small"></div><div id="result-detail" class="nk-small nk-muted"></div></div><button id="open-trash" type="button" class="nk-btn nk-ghost">Open Trash</button></div>

    <footer id="footer" class="nk-row-flex">
      <span id="selected" class="nk-small nk-muted nk-fill">Choose what to clean</span>
      <span class="nk-shortcuts">↑↓ Choose  ↩ Select  ⌘K Actions</span>
      <button id="clean" type="button" class="nk-btn nk-primary" disabled><svg class="icon"><use href="#i-sparkles"/></svg><span id="clean-label">Clean</span></button>
    </footer>

    <section id="confirmation" class="nk-card nk-tight nk-row-flex" aria-label="Confirm cleanup" hidden>
      <span id="confirm-text" class="nk-small nk-fill"></span>
      <button id="confirm-clean" type="button" class="nk-btn nk-danger">Clean</button>
      <button id="cancel-clean" type="button" class="nk-btn nk-ghost">Cancel</button>
    </section>
  </main>
  <script src="shell.js"></script>
  <script src="main.js"></script>
  <script src="keyboard.js" defer></script>
</body>
</html>
