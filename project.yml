name: Nook
options:
  bundleIdPrefix: com.yusuf
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
      - path: Plugins
        type: folder
        buildPhase: resources
    info:
      path: Nook/Info.plist
      properties:
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: Nook reads what's playing in Music and Spotify and controls playback.
        NSCalendarsUsageDescription: Nook shows your next meeting in the notch.
        NSCalendarsFullAccessUsageDescription: Nook shows your next meeting in the notch.
        NSRemindersUsageDescription: Nook lists your reminders so you can tick them off.
        NSMicrophoneUsageDescription: Nook records your voice for dictation.
        NSRemindersFullAccessUsageDescription: Nook lists your reminders so you can tick them off.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yusuf.nook
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
