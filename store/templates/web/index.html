<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"></head>
<body><main class="nk-root">
  <section class="nk-card nk-fill nk-col">
    <div id="loading" class="nk-empty"><i class="nk-spinner" aria-label="Loading"></i></div>
    <div id="empty" class="nk-empty" hidden><b>Ready to connect</b><span>Run the helper to see a reply.</span></div>
    <div id="error" class="nk-error" role="status" hidden></div>
    <output id="result" class="nk-fill nk-scroll" hidden></output>
  </section>
  <button id="run" class="nk-btn nk-primary" data-nk-autofocus>Run helper</button>
  <div class="nk-shortcuts">↩ Run · ⌘↩ Run · Esc Close</div>
</main><script src="main.js"></script></body></html>
