<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictation</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-wave" viewBox="0 0 20 20"><path d="M3 8v4m3-7v10m4-13v16m4-13v10m3-7v4"/></symbol>
    <symbol id="icon-mic" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v3m-3 0h6"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="icon-paste" viewBox="0 0 20 20"><path d="M7 4H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="7" y="2" width="6" height="4" rx="1"/><path d="M7 10h6m-6 3h4"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13M7 5V3.5h6V5M5 6l.8 10.5h8.4L15 6M8 9v4.5m4-4.5v4.5"/></symbol>
    <symbol id="icon-retry" viewBox="0 0 20 20"><path d="M16 7a6.5 6.5 0 1 0 .2 5M16 3v4h-4"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 20 20"><path d="m10 3 8 14H2Z"/><path d="M10 8v4m0 2.5v.1"/></symbol>
    <symbol id="icon-check" viewBox="0 0 20 20"><path d="m5 10 3.5 3.5L15 7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 20 20"><path d="m6 6 8 8M14 6l-8 8"/></symbol>
  </defs></svg>
  <main class="dictation-panel" aria-label="Dictation history">
    <header class="header">
      <label class="search-field"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><input id="search" type="search" placeholder="Search history" aria-label="Search dictation history" autocomplete="off" spellcheck="false"></label><span id="history-count" aria-live="polite">—</span>
      <div class="state-pill" id="state-pill" role="status" hidden><span id="state-icon"><svg class="icon" aria-hidden="true"><use href="#icon-wave"/></svg></span><span id="state-label">Checking dictation…</span></div>
      <button class="mic-button" id="mic-button" aria-label="Start dictation" title="Start dictation" disabled><svg class="icon" aria-hidden="true"><use href="#icon-mic"/></svg></button>
      <button class="clear-button" id="clear-button" disabled>Clear</button>
    </header>
    <div class="warning-card" id="key-warning" role="status" hidden><svg class="icon" aria-hidden="true"><use href="#icon-warning"/></svg><span>Add a Groq API key in Nook Settings</span></div>
    <div class="error-card" id="error-card" role="status" hidden><svg class="icon" aria-hidden="true"><use href="#icon-warning"/></svg><span id="error-text"></span><button class="icon-button" id="retry-load" aria-label="Refresh dictation" title="Refresh dictation"><svg class="icon" aria-hidden="true"><use href="#icon-retry"/></svg></button></div>
    <div class="clear-confirm" id="clear-confirm" role="alert" hidden><span>Clear all dictation history?</span><button class="small-button" id="cancel-clear">Cancel</button><button class="small-button destructive" id="confirm-clear">Clear all</button></div>
    <section class="history-list" id="history-list" aria-label="Dictation entries"><div class="empty-state"><span class="spinner" aria-hidden="true"></span><span>Loading your dictations…</span></div></section>
  </main>
</body>
</html>
