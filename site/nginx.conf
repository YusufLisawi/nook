server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Always-current download link, even if the page is cached.
  location = /download { return 302 https://github.com/YusufLisawi/nook/releases/latest/download/Nook.dmg; }
  location = /github   { return 302 https://github.com/YusufLisawi/nook; }

  location ~* \.(png|jpg|svg|ico|webp)$ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; }
  location / { try_files $uri $uri/ =404; }
}
